<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ShopSphere | Checkout</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/navbar.css"
    >

    <link
        rel="stylesheet"
        href="css/cart.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

</head>


<body>

<header class="navbar">

    <a
        href="index.html"
        class="logo"
    >
        🛒 ShopSphere
    </a>


    <nav>

        <a href="products.html">
            Products
        </a>

        <a href="cart.html">
            🛒 Cart
            <span class="cart-count">0</span>
        </a>

    </nav>

</header>


<main>

<section class="page-header">

    <span>
        SECURE CHECKOUT
    </span>

    <h1>
        Complete Your Order
    </h1>

</section>


<section class="section checkout-layout">

    <form
        id="checkoutForm"
        class="checkout-form"
    >

        <h2>
            Customer Information
        </h2>


        <label>
            Full Name
        </label>

        <input
            type="text"
            id="customerName"
            required
            placeholder="Enter your name"
        >


        <label>
            Email
        </label>

        <input
            type="email"
            required
            placeholder="Enter your email"
        >


        <label>
            Phone Number
        </label>

        <input
            type="tel"
            required
            placeholder="Enter phone number"
        >


        <label>
            Delivery Address
        </label>

        <textarea
            required
            placeholder="Enter complete address"
        ></textarea>


        <label>
            Payment Method
        </label>


        <div class="payment-options">

            <label>
                <input
                    type="radio"
                    name="payment"
                    value="cod"
                    checked
                >
                Cash on Delivery
            </label>


            <label>
                <input
                    type="radio"
                    name="payment"
                    value="upi"
                >
                UPI
            </label>


            <label>
                <input
                    type="radio"
                    name="payment"
                    value="card"
                >
                Card
            </label>

        </div>


        <button
            type="submit"
            class="checkout-btn"
        >
            Place Order
        </button>

    </form>


    <aside class="checkout-summary">

        <h2>
            Order Total
        </h2>


        <div class="summary-total">

            <span>
                Total
            </span>

            <strong id="checkoutTotal">
                ₹0
            </strong>

        </div>

    </aside>


    <div
        id="orderSuccess"
        class="order-success"
    >

        <div>
            🎉
        </div>

        <h2>
            Order Placed Successfully!
        </h2>

        <p>
            Thank you for shopping with us.
        </p>


        <p>
            Order ID:
            <strong id="orderId"></strong>
        </p>


        <p>
            Total:
            <strong id="orderTotal"></strong>
        </p>


        <a
            href="products.html"
            class="primary-btn"
        >
            Continue Shopping
        </a>

    </div>

</section>

</main>


<footer>

    <p>
        © 2026 ShopSphere
    </p>

</footer>


<script src="data/products-data.js"></script>

<script src="js/storage.js"></script>

<script src="js/products.js"></script>

<script src="js/app.js"></script>

<script src="js/checkout.js"></script>

</body>

</html>
